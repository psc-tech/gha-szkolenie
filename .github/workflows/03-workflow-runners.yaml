name: 03 – Workflow Runners

on: 
  push:

jobs:
  ubuntu-echo:
    runs-on: ubuntu-latest
    steps:
      - name: Show OS
        run: |
          echo "This job is running on an Ubuntu runner."
          lsb_release -a
          echo "${{ github.RUNNER_OS }}"
        #cat /etc/os-release
  windows-echo:
    runs-on: windows-latest
    steps:
      - name: Show OS
        run: |
          echo "This job is running on a Windows runner."
          echo "${{ github.RUNNER_OS }}"
          