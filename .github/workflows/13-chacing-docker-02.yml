name: 13 Build Docker image with actions/cache 02

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: ./CWICZENIA/13-caching/docker02

# env:
#   APP_DIR: ./CWICZENIA/12A-Cwiczenia-pipeline-gha/pogoda_python_flusk
#   IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_USERNAME2 }}/${{ vars.DOCKER_IMAGE_NAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        id: cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-docker-buildx-${{ hashFiles('Dockerfile', 'index.html') }}
          path: /tmp/.buildx-cache
          restore-keys: ${{ runner.os }}-docker-buildx-
      - name: Build the image once without API credentials
        uses: docker/build-push-action@v6
        with:
          context: ./CWICZENIA/13-caching/docker01
          file: ./CWICZENIA/13-caching/docker01/Dockerfile
          tags: ${{ env.CI_IMAGE }}
          load: true
          push: false
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
